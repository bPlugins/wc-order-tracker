name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check
        run: composer lint

      - name: PHPCS (WordPress coding standards + PHP compatibility)
        if: matrix.php == '8.3'
        run: vendor/bin/phpcs --no-cache

      - name: PHPUnit
        run: vendor/bin/phpunit

  js:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint:js

      - name: Jest
        run: npm run test:js

  version:
    name: Version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Versions match (header, constant, readme, package.json)
        id: version
        run: echo "version=$(bin/check-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Release PRs into main must bump the version
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "::error::Tag v${{ steps.version.outputs.version }} already exists. Bump the version (cbwct.php header + CBWCT_TRACKER_VERSION, readme.txt Stable tag, package.json) before merging into main."
            exit 1
          fi

  build:
    name: Production zip
    needs: [php, js, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Build production zip
        id: build
        env:
          SUFFIX: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref_name, github.sha) }}
        run: |
          SUFFIX="$(echo "$SUFFIX" | tr '/' '-' | cut -c1-40)"
          bin/build-zip.sh "$SUFFIX"

      - name: Upload production zip
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.zip }}
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Post QA download link on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ZIP_NAME: ${{ steps.build.outputs.zip_name }}
          URL: ${{ steps.upload.outputs.artifact-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body=$(cat <<EOF
          ### 📦 Production zip for QA

          **[${ZIP_NAME}.zip](${URL})** — built from \`${SHA:0:7}\`, all checks passed.

          Install: WordPress → Plugins → Add New → Upload Plugin. The link needs a GitHub login and expires after 30 days. A push to this PR rebuilds the zip and updates this comment.
          EOF
          )
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --body "$body" \
            || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"

  ci-passed:
    name: CI passed
    if: always()
    needs: [php, js, version, build]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::One or more CI jobs did not succeed."
            exit 1
          fi
